<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atc.Markdown</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Open documents"></nav>
    <div id="viewport" class="viewport">
      <aside id="wiki-sidebar" class="wiki-sidebar" aria-label="Wiki sidebar" hidden>
        <div id="wiki-sidebar-body" class="markdown-body wiki-sidebar-body"></div>
        <details id="wiki-pages" class="wiki-pages">
          <summary id="wiki-pages-summary">Pages</summary>
          <input
            id="wiki-pages-filter"
            class="wiki-pages-filter"
            type="text"
            placeholder="Find a page or text…"
            aria-label="Find a page"
            spellcheck="false"
            autocomplete="off"
          />
          <ul id="wiki-pages-list" class="wiki-pages-list"></ul>
          <p id="wiki-search-title" class="wiki-search-title" hidden></p>
          <ul id="wiki-search-results" class="wiki-search-results"></ul>
        </details>
      </aside>
      <div id="wiki-splitter" class="wiki-splitter" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" hidden></div>
      <main id="content" class="content">
        <div id="wiki-banner" class="info-bar" hidden></div>
        <header id="wiki-header" class="wiki-header" hidden></header>
        <div id="empty" class="empty">
          <p class="empty-title">Drop Markdown files here</p>
          <p class="empty-hint">or open a <code>.md</code> file with Atc.Markdown</p>
          <div class="empty-actions">
            <button id="open-button" class="open-button" type="button">Open file…</button>
            <button id="open-wiki-button" class="open-button" type="button">Open wiki folder…</button>
          </div>
          <p class="empty-shortcut">Ctrl+O · Ctrl+Shift+O</p>
          <section id="recent" class="recent" hidden>
            <div class="recent-header">
              <h2>Recent</h2>
              <button id="recent-clear" class="settings-reset" type="button">Clear</button>
            </div>
            <ul id="recent-list" class="recent-list"></ul>
          </section>
        </div>
        <article id="preview" class="markdown-body" hidden></article>
        <footer id="wiki-footer" class="markdown-body wiki-footer" hidden></footer>
        <div id="settings-view" class="settings-view" hidden></div>
      </main>
      <nav id="outline" class="outline" aria-label="Outline" hidden>
        <p class="outline-title">On this page</p>
        <ol id="outline-list" class="outline-list"></ol>
      </nav>
      <div id="link-status" class="link-status" aria-live="polite" aria-hidden="true"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="link-menu" class="context-menu" role="menu" aria-label="Link" hidden></div>
      <div id="find-bar" class="find-bar" role="search" hidden>
        <input
          id="find-input"
          class="find-input"
          type="text"
          placeholder="Find"
          aria-label="Find in document"
          spellcheck="false"
          autocomplete="off"
        />
        <span id="find-count" class="find-count" aria-live="polite"></span>
        <button id="find-previous" class="find-button" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
        <button id="find-next" class="find-button" type="button" title="Next match (Enter)" aria-label="Next match">↓</button>
        <button id="find-close" class="find-button" type="button" title="Close (Escape)" aria-label="Close find">×</button>
      </div>
    </div>
  </body>
</html>
